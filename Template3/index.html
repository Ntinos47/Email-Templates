<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rockstar</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,100..900&display=swap" rel="stylesheet">

</head>
<body>

<table class="wrapper" cellpadding="0" cellspacing="0" border="0">
    <tr>
        <td align="center">

            <table class="container" cellpadding="0" cellspacing="0" border="0">


                <tr>
                    <td class="header">
                        <table class="header-table" cellpadding="0" cellspacing="0" border="0">
                            <tr>
                                <td class="nav nav-left">Events</td>
                                <td class="nav nav-left">News</td>
                                <td class="nav-logo-wrap"><img class="nav-logo" src="img/Logo.png" alt=""></td>                                
                                <td class="nav  nav-right">Blog</td>
                                <td class="nav nav-right">Contact</td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td class="wrap-hero-img" style="position: relative; line-height: 0;">
                        <img class="hero-img" src="img/img1.jpg" width="100%" height="688" alt="Nick Drake" style="display: block; border: 0;">

                        <table class="hero-content" border="0" cellpadding="40" cellspacing="0" width="100%" style="position: absolute; top: 0; left: 0; height: 688px;">
                            <tr>
                                <td valign="top" align="left">
                                    <h1 class="hero-text" style="margin: 0;">
                                        A NIGHT OF <br>
                                        NICK <br>
                                        DRAKE AT <br>
                                        <span>SPIRITLAND</span>
                                    </h1>
                                </td>
                            </tr>
                            <tr>
                                <td valign="bottom" align="right">
                                    <table border="0" cellpadding="0" cellspacing="0" width="400" align="right">
                                        <tr>
                                            <td align="left">
                                                <p class="hero-text" style="margin: 0;">
                                                    We are proud to present Joe Boyd and Pete Paphides at Spiritland 
                                                    for a night of music and conversation about the life and work of Nick Drake.
                                                </p>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td align="left"  style="padding-bottom: 40px;">
                                                <a href="#" class="btn">READ NOW →</a>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!--Title-->
                <tr>
                    <td class="wrap-sec-title">
                        <h2 class="section-title">LIVE TALK</h2>
                    </td>
                </tr>

                <!--Content-->
                <tr>
                    <td>
                       <img src="img/img2.jpg" alt=""> 
                    </td>
                    <td>
                        <img src="img/img3.jpg" alt=""> 
                        <p>HELLO MUSIC LOVERS</p>
                    </td>
                    <td>
                       <img src="img/img4.jpg" alt=""> 
                    </td>
                </tr>







            </table>

        </td>
    </tr>
</table>

</html>
